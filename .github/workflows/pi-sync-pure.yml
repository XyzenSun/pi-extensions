name: Publish pi-sync-pure

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: pi-sync-pure/package-lock.json

      - name: Install dependencies
        working-directory: pi-sync-pure
        run: npm ci --ignore-scripts

      - name: Typecheck
        working-directory: pi-sync-pure
        run: npm run typecheck

      - name: Test
        working-directory: pi-sync-pure
        run: npm test

      - name: Publish to npm
        working-directory: pi-sync-pure
        run: npm publish --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
